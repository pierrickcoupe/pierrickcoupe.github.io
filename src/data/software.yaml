platform:
  name: volBrain
  url: https://volbrain.net
  text: >-
    Automated brain MRI analysis in the cloud: upload a scan from your browser and receive a
    full structural report. Co-founded with the Universitat Politècnica de València,
    volBrain has processed more than 800,000 MRI scans worldwide.
# Pipelines available on volBrain
pipelines:
  - {name: AssemblyNet, text: Whole-brain segmentation (ensemble of CNNs)}
  - {name: vol2Brain, text: Complete brain MRI analysis pipeline}
  - {name: DeepLesionBrain, text: White matter lesion segmentation}
  - {name: HIPS, text: Hippocampal subfield segmentation}
  - {name: CERES / DeepCERES, text: Cerebellar lobule segmentation}
  - {name: DeepTHALAMUS, text: Thalamic nuclei segmentation}
  - {name: pBrain, text: Segmentation of Parkinson's-related structures}
  - {name: petBrain, text: "A/T/N quantification from PET and MRI"}
# Downloadable research code (links point to the legacy pages until migrated)
toolboxes:
  - {name: MRI denoising, text: Optimized blockwise non-local means and related filters for 3D MRI, url: "https://sites.google.com/site/pierrickcoupe/softwares/denoising/mri-denoising/mri-denoising-software"}
  - {name: DWI denoising, text: Denoising of diffusion-weighted images, url: "https://sites.google.com/site/pierrickcoupe/softwares/denoising/dwi-denoising/dwi-denoising-software"}
  - {name: Speckle reduction, text: Optimized Bayesian non-local means filter for ultrasound, url: "https://sites.google.com/site/pierrickcoupe/softwares/denoising/speckle-reduction/optimized-bayesian-non-local-means-filter"}
  - {name: Multiphoton filtering, text: Non-local filtering for multiphoton microscopy, url: "https://sites.google.com/site/pierrickcoupe/softwares/denoising/multiphoton-image-filtering"}
  - {name: Noise estimation, text: Robust Rician noise estimation for MR images, url: "https://sites.google.com/site/pierrickcoupe/softwares/noise-estimation"}
  - {name: Brain extraction, text: Non-local intracranial cavity extraction, url: "https://sites.google.com/site/pierrickcoupe/softwares/segmentation/brain-extraction"}
  - {name: Structure segmentation, text: Patch-based label fusion for brain structures, url: "https://sites.google.com/site/pierrickcoupe/softwares/segmentation/structure-segmentation"}
  - {name: Super-resolution, text: Monomodal and multimodal MRI super-resolution, url: "https://sites.google.com/site/pierrickcoupe/softwares/super-resolution"}
