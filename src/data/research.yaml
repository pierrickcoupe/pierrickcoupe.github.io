# Research axes (home page cards + research page)
- id: deep-learning
  icon: network
  title: Deep learning for medical imaging
  short: Segmentation, lesion detection and image enhancement with architectures such as AssemblyNet.
  intro: >-
    Deep learning methods borrowed from computer vision often struggle with medical images:
    data are heterogeneous, annotations are scarce, and results must be anatomically
    consistent and clinically reliable. My work designs domain-adapted networks that embed
    physical, statistical and anatomical priors instead of treating models as black boxes.
  points:
    - title: Image enhancement and reconstruction
      text: Learning-based MRI denoising, super-resolution and contrast synthesis that recover fine anatomical detail from degraded or accelerated acquisitions.
    - title: Segmentation and atlas-informed learning
      text: Hybrid approaches combining convolutional architectures with explicit anatomical representations, for robust whole-brain, structure and lesion segmentation across datasets.
    - title: Computer-aided diagnosis
      text: Imaging biomarkers for neurodegenerative diseases, multiple sclerosis and stroke, supporting early detection, differential diagnosis and disease monitoring.
- id: big-data
  icon: database
  title: Big data analysis for neuroimaging
  short: Lifespan models of brain structure built from very large MRI cohorts, to characterise ageing and neurodegeneration.
  intro: >-
    Studies of brain maturation and ageing have long disagreed, largely because they covered
    narrow age ranges, used small samples and inconsistent processing. Leveraging openly
    shared datasets, I develop methods that analyse brains from neonates to the elderly in a
    single, consistent framework.
  points:
    - title: Large-scale processing
      text: Automated pipelines robust to differences in acquisition protocols, image quality and populations, producing reproducible measurements across tens of thousands of scans.
    - title: Lifespan modelling
      text: Normative trajectories of brain structures from early development to advanced age.
    - title: Disease modelling
      text: Measuring how individuals deviate from normative trajectories to build quantitative biomarkers of Alzheimer's disease, frontotemporal dementia, multiple sclerosis and other conditions.
- id: cloud
  icon: cloud
  title: Cloud solutions for image analysis
  short: Online platforms that put state-of-the-art brain analysis one upload away for any research or clinical team.
  intro: >-
    MRI pipelines usually require complex installation, dedicated hardware and expertise,
    which limits their use in clinics and by non-specialists. With colleagues at the
    Universitat Politècnica de València, I co-founded volBrain, a software-as-a-service
    platform where analyses run fully automatically from a web browser.
  points:
    - title: Cloud infrastructure
      text: A distributed, scalable platform for high-throughput MRI processing with reproducible results.
    - title: Automated pipelines
      text: Segmentation, volumetry and quality-controlled reports, continuously updated as methods improve.
    - title: Worldwide adoption
      text: More than 800,000 MRI scans processed by users around the world.
