bio: >-
  Pierrick Coupé received an M.Eng. in biomedical engineering from the University of
  Technology of Compiègne (2003), an M.Sc. in image and signal processing (2004) and a
  Ph.D. in image processing (2008) from the University of Rennes I, under the supervision
  of Christian Barillot and Pierre Hellier; his thesis received the IEEE France best thesis
  prize. He was then a postdoctoral fellow at the Montreal Neurological Institute (McGill
  University) with D. Louis Collins from 2008 to 2011. He joined CNRS as a researcher at
  LaBRI in 2011 and became CNRS Research Director in 2019. He led the PICTURA group from
  2013 to 2023; since 2023 he co-leads the Digital Health axis of LaBRI and leads the
  in2brain group.
